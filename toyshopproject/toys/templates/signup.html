<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Toy Shop Inventory System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            width: 85%;
            max-width: 500px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .container p {
            margin-bottom: 15px;
        }
        .container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .container input[type="text"],
        .container input[type="password"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .helptext {
            font-size: 12px;
            color: #666;
            display: block;
            margin-top: 4px;
        }
        .errorlist {
            color: #e74c3c;
            padding-left: 20px;
            font-size: 13px;
        }
        .btn-submit {
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn-submit:hover {
            background-color: #27ae60;
        }
        .link-bar {
            text-align: center;
            margin-top: 15px;
        }
        .link-bar a {
            color: #3498db;
            text-decoration: none;
        }
        .link-bar a:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 50px;
            padding: 15px;
            background-color: #ecf0f1;
            color: #555;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Toy Shop Inventory System</h1>
    </header>

    <div class="container">
        <h2>Create an Account</h2>

        <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Sign Up</button>
        </form>

        <div class="link-bar">
            Already have an account? <a href="{% url 'login' %}">Login here</a>
        </div>
    </div>

    <footer>
        <p>Ziuke Infotech (OPC) Private Limited &copy; 2026. All rights reserved.</p>
    </footer>

</body>
</html>
