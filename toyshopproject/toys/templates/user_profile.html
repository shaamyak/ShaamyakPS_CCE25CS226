<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile - Toy Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            width: 85%;
            max-width: 650px;
            margin: 30px auto;
        }
        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 14px;
        }
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        input[readonly] {
            background-color: #f1f2f6;
            color: #7f8c8d;
        }
        textarea {
            resize: vertical;
            min-height: 70px;
        }
        .btn {
            display: inline-block;
            padding: 10px 22px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }
        .btn-green { background-color: #2ecc71; color: white; }
        .btn-blue { background-color: #3498db; color: white; }

        .success-box {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
            font-weight: bold;
        }
        footer {
            margin-top: 50px;
            padding: 20px;
            background-color: #ecf0f1;
            color: #555;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Toy Shop Inventory System</h1>
    </header>

    <div class="container">
        <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
            <a href="{% url 'user_dashboard' %}" style="color: #3498db; text-decoration: none; font-weight: bold;">&larr; Back to Dashboard</a>
            <a href="{% url 'user_orders' %}" style="color: #3498db; text-decoration: none; font-weight: bold;">My Orders &rarr;</a>
        </div>

        <div class="profile-card">
            <h2 style="margin-top: 0; color: #2c3e50;">Manage Profile</h2>
            <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 20px;">Keep your contact and shipping information updated</p>

            {% if message %}
                <div class="success-box">{{ message }}</div>
            {% endif %}

            <form method="POST" action="{% url 'user_profile' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label>Username (account identifier):</label>
                    <input type="text" value="{{ user.username }}" readonly>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="first_name">First Name:</label>
                        <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="last_name">Last Name:</label>
                        <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" value="{{ user.email }}">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="text" id="phone" name="phone" value="{{ profile.phone }}" placeholder="+91 98765 43210">
                </div>

                <div class="form-group">
                    <label for="address">Delivery Address:</label>
                    <textarea id="address" name="address" placeholder="Enter full address for orders">{{ profile.address }}</textarea>
                </div>

                <button type="submit" class="btn btn-green">Save Profile Changes</button>
            </form>
        </div>
    </div>

    <footer>
        <p>Toy Shop Inventory System &copy; 2026. All rights reserved.</p>
    </footer>

</body>
</html>
