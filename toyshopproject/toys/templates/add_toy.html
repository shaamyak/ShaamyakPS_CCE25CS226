<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Toy - Toy Shop Inventory System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            width: 80%;
            max-width: 600px;
            margin: 30px auto;
            background-color: white;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }
        .btn-submit {
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit:hover {
            background-color: #27ae60;
        }
        .nav-link {
            display: inline-block;
            margin-top: 15px;
            color: #3498db;
            text-decoration: none;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 40px;
            padding: 15px;
            background-color: #ecf0f1;
            color: #555;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Toy Shop Inventory System</h1>
    </header>

    <div class="container">
        <h2>Add New Toy</h2>

        <form id="toyForm" method="POST" action="{% url 'add_toy' %}" onsubmit="return validateForm()">
            {% csrf_token %}

            <div class="form-group">
                <label for="toy_name">Toy Name:</label>
                <input type="text" id="toy_name" name="toy_name" placeholder="Enter toy name">
            </div>

            <div class="form-group">
                <label for="age_group">Age Group:</label>
                <input type="text" id="age_group" name="age_group" placeholder="e.g. 3-5 Years">
            </div>

            <div class="form-group">
                <label for="category">Category:</label>
                <input type="text" id="category" name="category" placeholder="e.g. Board Games, Action Figures">
            </div>

            <div class="form-group">
                <label for="price">Price:</label>
                <input type="text" id="price" name="price" placeholder="e.g. 499">
            </div>

            <button type="submit" class="btn-submit">Save Toy</button>
        </form>

        <a href="{% url 'toy_list' %}" class="nav-link">&larr; Back to Toy List</a>
    </div>

    <script>
        function validateForm() {
            var toyName = document.getElementById("toy_name").value.trim();
            var ageGroup = document.getElementById("age_group").value.trim();
            var category = document.getElementById("category").value.trim();
            var price = document.getElementById("price").value.trim();

            if (toyName === "" || ageGroup === "" || category === "" || price === "") {
                alert("Please fill in all fields before submitting!");
                return false;
            }

            return true;
        }
    </script>

    <footer>
        <p>Toy Shop Inventory System &copy; 2026. All rights reserved.</p>
    </footer>

</body>
</html>
