<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up - Toy Shop Inventory System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 85%;
            max-width: 500px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .container p {
            margin-bottom: 15px;
        }

        .container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .container input[type="text"],
        .container input[type="password"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .helptext {
            font-size: 12px;
            color: #666;
            display: block;
            margin-top: 4px;
        }

        .error-box {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #f5c6cb;
            font-size: 14px;
        }

        .errorlist {
            color: #e74c3c;
            padding-left: 20px;
            font-size: 13px;
        }

        .btn-submit {
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .btn-submit:hover {
            background-color: #27ae60;
        }

        .link-bar {
            text-align: center;
            margin-top: 15px;
        }

        .link-bar a {
            color: #3498db;
            text-decoration: none;
        }

        .link-bar a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 50px;
            padding: 15px;
            background-color: #ecf0f1;
            color: #555;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto; padding: 0 15px;">
            <h1 style="margin: 0; font-size: 22px;"><a href="{% url 'home' %}" style="color: white; text-decoration: none;">Toy Shop Inventory System</a></h1>
            <a href="{% url 'home' %}" style="background: rgba(255,255,255,0.2); color: white; padding: 7px 15px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 14px; border: 1px solid rgba(255,255,255,0.35);">Home</a>
        </div>
    </header>

    <div class="container">
        <div style="margin-bottom: 15px;">
            <a href="{% url 'home' %}" style="color: #3498db; text-decoration: none; font-size: 14px; font-weight: bold;">&larr; Back to Home</a>
        </div>
        <h2>Create an Account</h2>

        {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Sign Up</button>
        </form>

        <div class="link-bar">
            Already have an account? <a href="{% url 'login' %}">Login here</a>
        </div>
        <div class="link-bar" style="margin-top: 8px;">
            Want to create an Administrator account? <a href="{% url 'admin_signup' %}" style="color: #e74c3c; font-weight: bold;">Admin Sign Up here</a>
        </div>
    </div>

    <footer>
        <p>Toy Shop Inventory System &copy; 2026. All rights reserved.</p>
    </footer>

</body>

</html>
